[package]
name = "wldview"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.56"
directories = "6"
egui-macroquad = { git = "https://github.com/crumblingstatue/egui-macroquad.git" }
egui-file-dialog = "0.12"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.79"
terraria-wld = { path = "../terraria-wld" }
terraria-strings = { path = "../terraria-strings" }
recently_used_list = { git = "https://github.com/crumblingstatue/recently_used_list.git" }
